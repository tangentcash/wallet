[package]
name = "tangentwallet"
version = "0.1.0"
description = "Tangent Cash — privacy-focused, non-custodial cryptocurrency wallet and on-chain DEX"
authors = ["Tangent Cash"]
license = "MIT"
edition = "2021"

[lib]
name = "tangentwallet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
# enabled by `yarn tauri:dev`; store builds stay devtools-free
devtools = ["tauri/devtools"]
